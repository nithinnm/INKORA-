name: INKORA staging checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: inkora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INKORA_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/inkora_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: pip install -r requirements-lock.txt
      - run: pip check
      - run: pip-audit --local
      - run: python -m pip download --only-binary=:all: -r requirements-runtime-hashed.txt -r requirements-build-lock.txt --require-hashes -d .build/wheels
      - run: docker build --network=none -t inkora:ci .
      - run: python -m pytest -q
