# Template: substitute IMAGE, PROJECT, SERVICE_ACCOUNT, BUCKET and PUBLIC_URL.
# Review before applying. No resources are created by this file.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: inkora-staging
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '3'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      serviceAccountName: SERVICE_ACCOUNT
      containerConcurrency: 2
      timeoutSeconds: 60
      containers:
        - image: IMAGE
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          env:
            - name: INKORA_CLOUD_PROJECT
              value: PROJECT
            - name: INKORA_ENV
              value: staging
            - name: INKORA_GCS_BUCKET
              value: BUCKET
            - name: INKORA_PUBLIC_URL
              value: PUBLIC_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: inkora-staging-database-url
                  key: latest
            - name: INKORA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: inkora-staging-session-secret
                  key: latest
            - name: INKORA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: inkora-staging-encryption-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health/ready
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
            periodSeconds: 30
            failureThreshold: 3
